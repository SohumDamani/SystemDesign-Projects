name: Test and deploy the site

on:
  push:
    branches: [main, site-launch]
    paths:
      - 'site/**'
      - 'Rate Limiter/app/rate_limit.lua'
      - '.github/workflows/site.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'Rate Limiter/app/rate_limit.lua'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6390:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      # The rate limiter lab claims to behave exactly like real Redis, so check it.
      - run: npm run test:redis
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site/dist

  deploy:
    # Publishes to the gh-pages branch, which GitHub Pages serves.
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/site-launch')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist
      - name: Push the build to gh-pages
        working-directory: dist
        run: |
          touch .nojekyll
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy ${GITHUB_SHA}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
